<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A randomly generated sliding maze game.">
  <title>Arrow Escape</title>
  <style>
    :root{--ink:#201a2c;--purple:#6d35e8;--lime:#c8f15a;--paper:#f5f1e8;--line:#d8d0e6}*{box-sizing:border-box}html{background:#e9e3d7}body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 15% 0%,rgba(109,53,232,.09),transparent 30%),linear-gradient(135deg,#f1ede4,#e4ded2)}button,select{font:inherit}main{width:min(1540px,calc(100% - 24px));min-height:100vh;margin:auto;padding:30px 0 20px;display:grid;place-content:center}.game-shell{width:min(100%,1180px);margin:auto;overflow:hidden;background:var(--paper);border:1px solid rgba(32,26,44,.12);border-radius:22px;box-shadow:0 28px 70px rgba(45,31,75,.17),0 4px 0 rgba(45,31,75,.08)}.game-shell.hard-mode{width:min(100%,1480px)}header{padding:30px 42px 24px;border-bottom:1px solid var(--line)}.hard-mode header{padding:18px 28px 15px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--purple);font-size:12px;font-weight:900;letter-spacing:.18em}.eyebrow-arrow{display:grid;width:28px;height:28px;place-items:center;color:white;background:var(--purple);border-radius:8px;font-size:17px;letter-spacing:0}.heading-row{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-top:16px}.hard-mode .heading-row{margin-top:10px}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,5vw,64px);line-height:.95;letter-spacing:-.05em}.hard-mode h1{font-size:clamp(34px,3.4vw,50px)}header p{margin:13px 0 0;color:#736d7d;font-size:14px}.hard-mode header p{margin-top:8px}.game-status{display:flex;align-items:stretch;gap:8px}.complexity-picker,.counter{display:flex;min-height:57px;flex-direction:column;justify-content:center;background:white;border:1px solid var(--line);border-radius:12px}.complexity-picker{min-width:116px;padding:8px 12px}.complexity-picker span,.counter span{display:block;color:#898292;font-size:9px;font-weight:800;letter-spacing:.14em}.complexity-picker select{width:100%;margin-top:4px;padding:0;color:var(--ink);background:transparent;border:0;outline:0;cursor:pointer;font-size:14px;font-weight:800}.counter{min-width:86px;padding:10px 14px;text-align:center}.counter.time{min-width:104px}.counter strong{font-family:Georgia,serif;font-size:26px;line-height:1.1;white-space:nowrap}.maze-wrap{position:relative;padding:34px 50px;background-color:#25184a;background-image:radial-gradient(circle at 20% 20%,rgba(124,79,228,.2),transparent 22%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,20px 20px,20px 20px}.hard-mode .maze-wrap{padding:18px 22px}.maze{position:relative;display:grid;width:100%;contain:layout paint;overflow:hidden;border:4px solid #49279a;border-radius:7px;background:#efeaf7;box-shadow:0 14px 28px rgba(9,4,24,.38)}.cell{position:relative;display:grid;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;place-items:center}.wall{background:linear-gradient(145deg,rgba(255,255,255,.14),transparent 40%),var(--purple);box-shadow:inset 0 0 0 1px rgba(54,17,133,.25)}.path{background:#f4f0f8}.goal{background:#ecffd0}.goal-dot{width:38%;aspect-ratio:1;background:#83bd17;border-radius:50%;box-shadow:0 0 0 4px rgba(131,189,23,.18)}.player{z-index:2;display:grid;width:82%;max-width:100%;aspect-ratio:1;place-items:center;color:var(--ink);background:var(--lime);border-radius:50%;box-shadow:0 0 0 2px white,0 4px 10px rgba(32,26,44,.35);font-size:clamp(8px,1.45vw,19px);font-weight:900;line-height:1;transition:transform 120ms ease}.start-label,.finish-label{position:absolute;z-index:3;top:44px;padding:5px 9px;color:white;background:#201a2c;border-radius:5px;font-size:8px;font-weight:900;letter-spacing:.12em}.start-label{left:16px}.finish-label{right:10px;top:auto;bottom:44px;color:var(--ink);background:var(--lime)}.win-card{position:absolute;z-index:5;top:50%;left:50%;width:min(320px,calc(100% - 36px));padding:25px;text-align:center;background:var(--paper);border:4px solid var(--lime);border-radius:18px;box-shadow:0 24px 70px rgba(8,3,23,.62);transform:translate(-50%,-50%);animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}.win-card::before{position:fixed;z-index:-1;inset:-100vh;background:rgba(17,9,39,.55);content:""}.win-icon{display:grid;width:48px;height:48px;margin:0 auto 10px;place-items:center;color:#4d1bad;background:var(--lime);border-radius:50%;font-size:22px}.win-card h2{margin:0;font-family:Georgia,serif;font-size:42px;letter-spacing:-.04em}.win-card p{margin:7px 0 18px;color:#6f6879}.win-card button,.restart{cursor:pointer;border:0;font-weight:800}.win-card button{padding:11px 21px;color:white;background:var(--purple);border-radius:9px}footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:20px 42px}.hard-mode footer{padding:12px 28px}.instructions{display:flex;align-items:center;gap:12px}.mini-arrow{display:grid;width:36px;height:36px;place-items:center;color:var(--purple);background:#e9e0fc;border-radius:8px}.instructions strong,.instructions span{display:block}.instructions strong{font-size:10px;letter-spacing:.13em}.instructions span{margin-top:3px;color:#7c7585;font-size:11px}.controls{display:grid;grid-template:repeat(2,31px)/repeat(3,31px);gap:4px}.controls button{display:grid;cursor:pointer;place-items:center;color:#534d5e;background:white;border:1px solid #cbc4d5;border-bottom-width:3px;border-radius:6px;font-size:16px;font-weight:900}.controls button:active{border-bottom-width:1px;transform:translateY(2px)}.up{grid-area:1/2}.left{grid-area:2/1}.down{grid-area:2/2}.right{grid-area:2/3}.restart{justify-self:end;padding:9px 12px;color:#645e6d;background:transparent;border-radius:8px;font-size:12px}.restart:hover{color:var(--purple);background:#eae3f6}.tip{margin:13px 0 0;color:#7c7585;text-align:center;font-size:9px;font-weight:800;letter-spacing:.14em}@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.75)}}@media(max-width:650px){main{width:min(100% - 18px,520px);padding:10px 0}.game-shell,.game-shell.hard-mode{width:100%}header,.hard-mode header{padding:22px 20px 19px}.heading-row{align-items:flex-start;flex-direction:column;gap:16px}.game-status{width:100%}.complexity-picker,.counter,.counter.time{min-width:0;flex:1}.maze-wrap,.hard-mode .maze-wrap{padding:25px 12px}.maze{border-width:3px}.start-label,.finish-label{display:none}footer,.hard-mode footer{grid-template-columns:1fr auto;padding:17px 20px}.instructions{display:none}.controls{grid-column:1;justify-self:start}.restart{grid-column:2}}@media(max-width:430px){h1{font-size:38px}.game-status{gap:5px}.complexity-picker,.counter{padding-inline:8px}.counter strong{font-size:22px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <section class="game-shell" id="game-shell" aria-label="Arrow escape maze">
      <header><div class="eyebrow"><span class="eyebrow-arrow">➜</span> ARROW ESCAPE</div><div class="heading-row"><div><h1>Find your way out.</h1><p>Choose a direction and slide to the next turn or junction.</p></div><div class="game-status"><label class="complexity-picker"><span>COMPLEXITY</span><select id="complexity" aria-label="Maze complexity"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><div class="counter time"><span>TIME</span><strong id="time">00:00</strong></div><div class="counter"><span>MOVES</span><strong id="moves">00</strong></div></div></div></header>
      <div class="maze-wrap" id="maze-wrap"><span class="start-label">START</span><span class="finish-label">FINISH</span><div class="maze" id="maze" role="application" aria-label="Random maze. Use arrow keys to slide to the finish."></div></div>
      <footer><div class="instructions"><div class="mini-arrow">➜</div><div><strong>SLIDE TO MOVE</strong><span>Arrow keys or W A S D</span></div></div><div class="controls" aria-label="Maze controls"><button class="up" data-direction="up" aria-label="Slide up">↑</button><button class="left" data-direction="left" aria-label="Slide left">←</button><button class="down" data-direction="down" aria-label="Slide down">↓</button><button class="right" data-direction="right" aria-label="Slide right">→</button></div><button class="restart" id="new-maze" type="button">↻ New maze</button></footer>
    </section><p class="tip">HIGHER COMPLEXITY MEANS MORE TURNS, MORE DECISIONS, AND A LARGER MAZE.</p>
  </main>
  <script>
    (()=>{const levels={easy:{width:21,height:15,straightBias:.72,maxStraight:6,splitChance:.05},medium:{width:33,height:23,straightBias:.22,maxStraight:2,splitChance:.68},hard:{width:51,height:31,straightBias:0,maxStraight:1,splitChance:.96}},dirs={up:{dx:0,dy:-1,angle:-90},right:{dx:1,dy:0,angle:0},down:{dx:0,dy:1,angle:90},left:{dx:-1,dy:0,angle:180}},keys={ArrowUp:"up",w:"up",W:"up",ArrowRight:"right",d:"right",D:"right",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left"},mazeEl=document.querySelector("#maze"),shell=document.querySelector("#game-shell"),levelEl=document.querySelector("#complexity"),timeEl=document.querySelector("#time"),movesEl=document.querySelector("#moves");let level="medium",maze,position,direction="right",moves=0,startedAt=0,won=false,clock;function generateMaze(kind){const{width,height,straightBias,maxStraight,splitChance}=levels[kind],grid=Array.from({length:height},()=>Array(width).fill("#")),active=[{x:1,y:1,dx:0,dy:0,run:0}];grid[1][1]=".";while(active.length){const index=Math.random()<splitChance?Math.floor(Math.random()*active.length):active.length-1,current=active[index],choices=[[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy])=>({x:current.x+dx,y:current.y+dy,dx,dy})).filter(point=>point.x>0&&point.y>0&&point.x<width-1&&point.y<height-1&&grid[point.y][point.x]==="#");if(!choices.length){active.splice(index,1);continue}const straight=choices.find(choice=>choice.dx===current.dx&&choice.dy===current.dy),turns=choices.filter(choice=>choice!==straight),keepStraight=straight&&current.run<maxStraight&&(turns.length===0||Math.random()<straightBias),pool=keepStraight?[straight]:turns.length?turns:choices,next=pool[Math.floor(Math.random()*pool.length)];grid[(current.y+next.y)/2][(current.x+next.x)/2]=".";grid[next.y][next.x]=".";active.push({...next,run:next.dx===current.dx&&next.dy===current.dy?current.run+1:1})}const start={x:0,y:1},finish={x:width-1,y:height-2};grid[start.y][start.x]=".";grid[finish.y][finish.x]=".";return{rows:grid.map(row=>row.join("")),start,finish,width,height}}function formatTime(seconds){return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}function updateStats(){movesEl.textContent=String(moves).padStart(2,"0");timeEl.textContent=formatTime(Math.floor((Date.now()-startedAt)/1000))}function render(){shell.classList.toggle("hard-mode",level==="hard");mazeEl.style.gridTemplateColumns=`repeat(${maze.width},minmax(0,1fr))`;mazeEl.style.gridTemplateRows=`repeat(${maze.height},minmax(0,1fr))`;mazeEl.style.aspectRatio=`${maze.width} / ${maze.height}`;mazeEl.innerHTML="";maze.rows.forEach((row,y)=>[...row].forEach((cell,x)=>{const cellEl=document.createElement("div"),isPlayer=x===position.x&&y===position.y,isFinish=x===maze.finish.x&&y===maze.finish.y;cellEl.className=`cell ${cell==="#"?"wall":"path"}${isFinish?" goal":""}`;if(isPlayer){const player=document.createElement("span");player.className="player";player.style.transform=`rotate(${dirs[direction].angle}deg)`;player.textContent="➜";cellEl.append(player)}else if(isFinish){const dot=document.createElement("span");dot.className="goal-dot";cellEl.append(dot)}mazeEl.append(cellEl)}))}function showWin(){const card=document.createElement("div");card.className="win-card";card.setAttribute("role","dialog");card.innerHTML=`<span class="win-icon">★</span><h2>YOU WIN!</h2><p>${moves} moves · ${timeEl.textContent}</p><button type="button">New maze</button>`;card.querySelector("button").addEventListener("click",startNewMaze);document.querySelector("#maze-wrap").append(card)}function startNewMaze(){level=levelEl.value;maze=generateMaze(level);position={...maze.start};direction="right";moves=0;won=false;startedAt=Date.now();clearInterval(clock);clock=setInterval(updateStats,250);updateStats();render();document.querySelector(".win-card")?.remove()}function move(nextDirection){if(won)return;direction=nextDirection;const{dx,dy}=dirs[nextDirection];let next={...position};while(maze.rows[next.y+dy]?.[next.x+dx]==="."){next={x:next.x+dx,y:next.y+dy};if(next.x===maze.finish.x&&next.y===maze.finish.y)break;const forwardOpen=maze.rows[next.y+dy]?.[next.x+dx]===".",hasSidePath=(nextDirection==="up"||nextDirection==="down")?(maze.rows[next.y]?.[next.x-1]==="."||maze.rows[next.y]?.[next.x+1]==="."):(maze.rows[next.y-1]?.[next.x]==="."||maze.rows[next.y+1]?.[next.x]===".");if(!forwardOpen||hasSidePath)break}if(next.x===position.x&&next.y===position.y){render();return}position=next;moves++;updateStats();render();if(position.x===maze.finish.x&&position.y===maze.finish.y){won=true;clearInterval(clock);showWin()}}levelEl.addEventListener("change",startNewMaze);document.querySelector("#new-maze").addEventListener("click",startNewMaze);document.querySelectorAll("[data-direction]").forEach(button=>button.addEventListener("click",()=>move(button.dataset.direction)));window.addEventListener("keydown",event=>{const next=keys[event.key];if(next){event.preventDefault();move(next)}});startNewMaze()})();
  </script>
</body>
</html>
